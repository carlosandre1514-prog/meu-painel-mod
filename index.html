    <script>
        async function enviarApk() {
            const fileInput = document.getElementById('apkFile');
            const statusDiv = document.getElementById('status');

            if (fileInput.files.length === 0) {
                alert('Por favor, selecione um arquivo APK primeiro!');
                return;
            }

            const arquivo = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', arquivo);

            statusDiv.innerHTML = 'Enviando e analisando APK na nuvem... Aguarde.';

            try {
                const resposta = await fetch('https://meu-painel-mod.onrender.com/upload', {
                    method: 'POST',
                    body: formData
                });

                if (resposta.ok) {
                    const resultado = await resposta.json();
                    statusDiv.innerHTML = `
                        <b>Sucesso! APK Analisado:</b><br>
                        📦 App: ${resultado.nome_app}<br>
                        🎯 Pacote: ${resultado.pacote}<br>
                        🔢 Versão: ${resultado.versao_nome} (Cód: ${resultado.versao_codigo})<br>
                        💾 Tamanho: ${resultado.tamanho}
                    `;
                } else {
                    statusDiv.innerText = 'Erro no servidor ao processar o APK.';
                }
            } catch (erro) {
                console.error(erro);
                statusDiv.innerText = 'Falha na conexão com o backend.';
            }
        }
    </script>
